name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate grammar ordering
        run: node scripts/validate-grammar.js

      - name: Check runtime dependency licenses
        run: node scripts/check-licenses.js

      # Verify the VS Code extension packages successfully (dry build, no publish)
      - name: Package VS Code extension
        working-directory: extensions/vscode
        run: npx --yes @vscode/vsce package --no-dependencies

      # Verify the IntelliJ plugin ZIP is structurally valid before release.
      - name: Build and verify IntelliJ plugin
        working-directory: extensions/intellij
        run: ./gradlew buildPlugin verifyPluginProjectConfiguration verifyPluginStructure
