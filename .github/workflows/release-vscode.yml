name: Release VS Code

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Validate grammar
        run: node scripts/validate-grammar.js

      - name: Set version in extension manifest
        working-directory: extensions/vscode
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Package extension
        working-directory: extensions/vscode
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        working-directory: extensions/vscode
        run: npx --yes @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        working-directory: extensions/vscode
        run: npx --yes ovsx publish *.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: extensions/vscode/*.vsix
          generate_release_notes: true
