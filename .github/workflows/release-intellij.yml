name: Release IntelliJ

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish IntelliJ plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate grammar
        run: node scripts/validate-grammar.js

      - name: Build plugin
        working-directory: extensions/intellij
        run: ./gradlew buildPlugin -PpluginVersion="${{ inputs.version }}"

      - name: Publish to JetBrains Marketplace
        working-directory: extensions/intellij
        run: ./gradlew publishPlugin -PpluginVersion="${{ inputs.version }}"
        env:
          ORG_GRADLE_PROJECT_intellijPlatformPublishingToken: ${{ secrets.INTELLIJ_PLATFORM_PUBLISHING_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-intellij
          name: IntelliJ v${{ inputs.version }}
          files: extensions/intellij/build/distributions/*.zip
          generate_release_notes: true
